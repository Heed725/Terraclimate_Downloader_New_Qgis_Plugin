name: Build and Release QGIS Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-latest
    env:
      VERSION: 1.0.0
      PLUGIN_DIR: terraclimate_downloader
      ZIP_NAME: terraclimate_downloader_new-qgis-v1.0.0.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: |
          python -m py_compile terraclimate_downloader/__init__.py
          python -m py_compile terraclimate_downloader/plugin.py
          python -m py_compile terraclimate_downloader/terraclimate_algorithm.py

      - name: Validate metadata and dependency policy
        run: |
          grep -q '^name=TerraClimate Downloader New$' terraclimate_downloader/metadata.txt
          grep -q '^version=1.0.0$' terraclimate_downloader/metadata.txt
          grep -q '^qgisMinimumVersion=3.22$' terraclimate_downloader/metadata.txt
          ! grep -R -E '^[[:space:]]*(import|from)[[:space:]]+(xarray|rioxarray|netCDF4|dask|requests)' terraclimate_downloader/*.py

      - name: Build installable ZIP
        run: |
          rm -rf build "$ZIP_NAME"
          mkdir -p build/terraclimate_downloader
          cp terraclimate_downloader/__init__.py build/terraclimate_downloader/
          cp terraclimate_downloader/plugin.py build/terraclimate_downloader/
          cp terraclimate_downloader/terraclimate_algorithm.py build/terraclimate_downloader/
          cp terraclimate_downloader/metadata.txt build/terraclimate_downloader/
          cp terraclimate_downloader/icon.svg build/terraclimate_downloader/
          cp terraclimate_downloader/requirements.txt build/terraclimate_downloader/
          cp LICENSE build/terraclimate_downloader/LICENSE
          cd build
          zip -r "../$ZIP_NAME" terraclimate_downloader

      - name: Inspect installable ZIP
        run: |
          unzip -l "$ZIP_NAME"
          test -f build/terraclimate_downloader/metadata.txt
          test -f build/terraclimate_downloader/terraclimate_algorithm.py

      - name: Publish v1.0.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$ZIP_NAME" --clobber
          else
            gh release create "v$VERSION" "$ZIP_NAME" \
              --target "${GITHUB_SHA}" \
              --title "TerraClimate Downloader New QGIS Plugin v$VERSION" \
              --notes "Dependency-safe rebuild of the TerraClimate QGIS downloader. Removes xarray, rioxarray, netCDF4, dask and pip-installed NumPy requirements. Uses Python standard library networking plus QGIS-bundled GDAL and THREDDS NCSS subsetting."
          fi
